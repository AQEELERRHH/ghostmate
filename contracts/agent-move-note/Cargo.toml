[package]
name = "agent-move-note"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
miden = { version = "0.12" }

[package.metadata.component]
package = "miden:agent-move-note"

# Cross-component link: this note script calls game_contract::receive_move()
[package.metadata.miden.dependencies]
"miden:game-contract" = { path = "../game-contract" }

[package.metadata.component.target.dependencies]
"miden:game-contract" = { path = "../game-contract/target/generated-wit/" }

[package.metadata.miden]
project-kind = "note-script"
