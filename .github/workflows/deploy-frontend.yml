name: Deploy Frontend

# Runs on every push to main that touches the web app or this workflow file.
# Does NOT re-deploy contracts — it reads the previously-saved REGISTRY_ID
# from GitHub Actions variables (set by deploy.yml after a contract deployment).
#
# Required secrets:  VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Required variable: REGISTRY_ID  (set automatically by deploy.yml, or manually
#                    in Settings → Secrets and variables → Actions → Variables)
on:
  push:
    branches: [main]
    paths:
      - 'ghostmate-web/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ghostmate-web/package-lock.json

      - name: Install dependencies
        working-directory: ghostmate-web
        run: npm ci

      - name: Type-check
        working-directory: ghostmate-web
        run: npx tsc --noEmit

      # VITE_REGISTRY_ID is read from the Actions variable saved by deploy.yml.
      # If you haven't run a contract deployment yet, set REGISTRY_ID manually
      # in your repo's Settings → Secrets and variables → Actions → Variables.
      - name: Build
        working-directory: ghostmate-web
        env:
          VITE_REGISTRY_ID: ${{ vars.REGISTRY_ID }}
          VITE_RPC_URL:     testnet
          VITE_PROVER_URL:  testnet
        run: npm run build

      - name: Prepare Vercel output structure
        working-directory: ghostmate-web
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json

      - name: Deploy to Vercel
        working-directory: ghostmate-web
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest --silent
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" \
            > .vercel/project.json
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes

      # Print the live URL from Vercel's output so it appears in the
      # Actions run summary.
      - name: Print deployment URL
        if: success()
        run: echo "Deployed → $(vercel ls --token $VERCEL_TOKEN --yes 2>/dev/null | grep ghostmate | head -1 | awk '{print $2}')" || true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
