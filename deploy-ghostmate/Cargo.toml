[package]
name = "deploy-ghostmate"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deploy"
path = "src/main.rs"

[dependencies]
# miden-client: full Rust client SDK. The "sqlite" feature enables
# SqliteStore (the miden-client-sqlite-store backend).
miden-client = { version = "0.6", features = ["sqlite"] }

# Async runtime — miden-client is fully async.
tokio = { version = "1", features = ["full"] }

# RNG used for account seeds and key-pair generation.
rand = "0.8"

# Serialise deployed-addresses.json output.
serde_json = "1"

# Ergonomic error handling.
anyhow = "1"

# Hex encoding for seed output.
hex = "0.4"
